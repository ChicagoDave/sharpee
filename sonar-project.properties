# Files completely excluded from analysis (build artifacts, generated output; the generated
# TypeScript modules are held fresh by `./repokit grammar|manifest --check`, and the IDE's
# testing-surface bundle is built from tools/ide/web/testing-surface by build-testing-surface.sh).
sonar.exclusions=website/public/**,templates/**,**/dist/**,**/dist-esm/**,**/dist-npm/**,packages/chord/src/stdlib-manifest.ts,packages/parser-en-us/src/grammar.ts,tools/ide/SharpeeIDE/Resources/testing-surface/**

# Files classified as tests. SonarCloud's automatic analysis does not apply
# sonar.cpd.exclusions, so test files were measured for duplication regardless of the line
# below; test inclusions are applied, and a test file is never scanned for duplication.
sonar.test.inclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.config.ts,**/vitest.config.js

# Files excluded from copy-paste detection (tests, configs, parallel barrels, generated/template HTML).
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.config.ts,**/vitest.config.js,website/public/**,templates/**,packages/runtime/src/index.ts,packages/bridge/src/index.ts

# Tests excluded from coverage requirements (tests don't need coverage of themselves).
sonar.coverage.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,website/public/**,templates/**
