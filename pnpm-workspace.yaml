packages:
  - packages/*
  - packages/extensions/testing
  - packages/extensions/basic-combat
  - packages/extensions/scoring
  - packages/extensions/hunger
  - packages/extensions/chapters
  - '!packages/map-editor'
  # packages/interpreter retired 2026-08-13 (David) — the legacy Tauri
  # runner, unbuilt and importerless. Archived at
  # packages/_archive/interpreter; its ZifmiaRunner exports and
  # `zifmia-` localStorage save keys go with it.
  - '!packages/_archive/**'
  - stories/dungeo
  - stories/channel-service-test
  # ADR-259 D8: `stories/friendly-zoo` is now a pure Chord story — a
  # `.story`, its hatch, and its transcripts, with no package.json at all
  # (ADR-252 D2). The TypeScript tutorial that used to share the directory
  # moved out whole and keeps the workspace membership.
  - stories/family-zoo-tutorial
  # Chord golden gate (ADR-210 Phase A): membership makes `./repokit build
  # cloak-of-darkness` emit dist/extras.js (the cloak.story hatch module).
  - stories/cloak-of-darkness
  # tutorials/familyzoo is a standalone book-aligned project that consumes the
  # published @sharpee/* npm packages — it is no longer a workspace member.
  # tools/shite retired 2026-08-13 (David) — it was the same multi-user
  # server as zifmia under a second name, which is the misuse being retired.
  # Source archived at tools/_archive/shite.
  # tools/zifmia retired 2026-08-13 (David) — the name was misused and the
  # tool was never in active development. Source archived at
  # tools/_archive/zifmia, out of the workspace so its deps and build
  # artifacts stop being installed and rebuilt.
  - tools/repokit

# Public-hoist @sharpee/* and the lz-string vendored baseline entry so
# Node's ESM resolver can find every Story Runtime Baseline (ADR-178)
# package from arbitrary paths during dev — e.g., the bundle-cache
# directory the engine writes story.js into. The Docker runtime image
# already gets a flat node_modules via `pnpm deploy --legacy`; this
# config makes the dev workspace match that shape.
publicHoistPattern:
  - '@sharpee/*'
  - 'lz-string'

ignoredBuiltDependencies:
  - electron

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - nx
