name: Build Platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.13.1

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'pnpm'

    # Plain install (no --ignore-scripts): pnpm gates dependency build scripts via
    # onlyBuiltDependencies in pnpm-workspace.yaml; esbuild's binary is needed for
    # repokit's bundle step and would be skipped by --ignore-scripts.
    - name: Install dependencies
      run: pnpm install

    # The repokit engine imports @sharpee/core and @sharpee/devkit; the `...`
    # filter suffix builds its workspace dependency chain first on a cold checkout.
    - name: Build repokit engine
      run: pnpm --filter '@sharpee/repokit...' run build

    # Single source of truth for build order (PLATFORM_PACKAGES in
    # tools/repokit/src/repo.ts) — replaces the hand-maintained package list that
    # drifted and broke when transcript-tester gained a @sharpee/bootstrap import.
    # --no-genai: the genai API reference is IDE-shipped and repo-tracked; CI has
    # no consumer for a regenerated copy.
    - name: Build platform packages (repokit)
      run: ./repokit build --no-genai

    - name: Typecheck
      run: pnpm --filter '@sharpee/sharpee' exec tsc --noEmit

    - name: Run tests
      run: |
        pnpm --filter '@sharpee/core' test
        pnpm --filter '@sharpee/world-model' test
        pnpm --filter '@sharpee/event-processor' test
        pnpm --filter '@sharpee/parser-en-us' test
        pnpm --filter '@sharpee/lang-en-us' test
        pnpm --filter '@sharpee/if-services' test
        pnpm --filter '@sharpee/channel-service' test
        pnpm --filter '@sharpee/stdlib' test
        pnpm --filter '@sharpee/character' test
        pnpm --filter '@sharpee/engine' test
        pnpm --filter '@sharpee/transcript-tester' test
