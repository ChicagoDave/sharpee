# book.yaml — Pandoc defaults file for the Chord manual (edition pinned to Chord 4.1.0)
#
# Purpose: single source of truth for chapter order and shared render metadata.
#          `scripts/build-book.sh` loads this with `pandoc --defaults` and adds
#          per-format flags (output target, CSS, PDF engine).
# Owner:   docs/book authoring toolchain; the Chord manual plan
#          (docs/work/chord-manual/plan.md).
#
# Chapter order follows docs/work/chord-manual/chapters.md: Parts I to VIII,
# the preface and How to read this book, chapters 1 to 40, then appendices A to
# G. The title page and copyright page are not listed here; they live in frontmatter.yaml and are layered ahead of this
# body so they precede the table of contents.
#
# The title is David's ruling of 2026-11-15 (the plan's D-8).

from: markdown+fenced_divs+smart
standalone: true
toc: true
toc-depth: 2
number-sections: true

# Marks the rows of a typed listing that the printed page has to break
# (PDF only; the filter does nothing for HTML and EPUB).
filters:
  - filters/mark-wrapped-lines.lua

# Suppress pandoc's auto-generated EPUB title page; the authored
# frontmatter/00-title-page.md is the single title page for all three formats.
epub-title-page: false

metadata:
  title: "The Chord Manual"
  subtitle: "Writing Interactive Fiction in Chord (Chord 4.1.0, Sharpee 5.7.0)"
  author: "David Cornelson"
  lang: en-US

input-files:
  # Front matter after the table of contents
  - frontmatter/00-preface.md
  - frontmatter/01-how-to-read.md
  # Part I. A first story
  - parts/part-1/01-the-shape-of-a-story-file.md
