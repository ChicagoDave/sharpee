  - parts/part-2/09-what-things-can-do-the-trait-words.md
  - parts/part-2/10-light-dark-and-the-other-senses.md
  - parts/part-2/11-regions.md
  - parts/part-2/12-ways-that-are-closed-hidden-or-strange.md
