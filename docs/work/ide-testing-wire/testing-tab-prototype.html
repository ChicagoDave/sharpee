<style>
:root{
  --rail:#DCE0E8; --project:#E6E9EF; --editor:#EFF1F5; --play:#E6E9EF; --border:#ACB0BE;

  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --radius:5px; --row-h:26px;
}

  --rail:#16171D; --project:#262832; --editor:#1E1F26; --play:#13141A; --border:#3A3C48;

  --sel-soft:#89B4FA22; --run-wash:#89B4FA24; --fail-wash:#F38BA81a;
}}

  --fg:#D8D9E0; --fg-dim:#8E90A0; --fg-faint:#5C5F6D; --accent:#89B4FA; --on-accent:#11131A;
  --pass:#A6E3A1; --fail:#F38BA8; --unreached:#6C7086; --replay:#FAB387; --warn:#F9E2AF;
  --sel-soft:#89B4FA22; --run-wash:#89B4FA24; --fail-wash:#F38BA81a;
}
:root[data-theme="light"]{
  --rail:#DCE0E8; --project:#E6E9EF; --editor:#EFF1F5; --play:#E6E9EF; --border:#ACB0BE;
  --fg:#4C4F69; --fg-dim:#6C6F85; --fg-faint:#9CA0B0; --accent:#1E66F5; --on-accent:#EFF1F5;
  --pass:#40A02B; --fail:#D20F39; --unreached:#8C8FA1; --replay:#FE640B; --warn:#DF8E1D;
  --sel-soft:#1E66F51a; --run-wash:#1E66F51f; --fail-wash:#D20F3914;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--ui);font-size:13px;color:var(--fg);background:var(--editor);
  -webkit-font-smoothing:antialiased;line-height:1.55;}
.tab{display:flex;flex-direction:column;height:100vh;min-height:560px;}

/* ── toolbar + summary ────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;
  background:var(--rail);border-bottom:1px solid var(--border);}
.toolbar .story{font-weight:600;}
.toolbar .meta{font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);
  font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.phases{display:flex;gap:5px;}
.chip{font-size:11px;color:var(--fg-dim);border:1px solid var(--border);border-radius:var(--radius);
  padding:2px 7px;display:flex;gap:6px;align-items:center;background:var(--editor);}
.chip.busy{border-color:var(--accent);color:var(--accent);}
.chip .ms{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--fg-faint);}
.summary{display:flex;flex-wrap:wrap;background:var(--project);border-bottom:1px solid var(--border);}
.stat{padding:8px 16px;display:flex;flex-direction:column;gap:1px;min-width:88px;}
.stat+.stat{border-left:1px solid var(--border);}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-faint);}
.stat .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.stat .v small{font-size:11px;color:var(--fg-dim);letter-spacing:0;}
.v.pass{color:var(--pass);} .v.fail{color:var(--fail);} .v.unr{color:var(--unreached);}
.stat.progress{flex:1 1 200px;min-width:170px;justify-content:center;}
.bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:5px;}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .1s linear;}

/* ── Miller columns ───────────────────────────────────────── */
.cols{flex:1;display:flex;align-items:stretch;min-height:0;overflow-x:auto;}
.col{flex:0 0 208px;border-right:1px solid var(--border);overflow-y:auto;background:var(--editor);}
.col.preview{flex:1 1 320px;min-width:280px;border-right:0;background:var(--project);padding:12px 14px;}
.crow{display:flex;align-items:center;gap:7px;width:100%;height:var(--row-h);padding:0 8px;
  border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:left;}
.crow:hover{background:var(--sel-soft);}
.crow[aria-selected="true"]{background:var(--accent);color:var(--on-accent);}
.crow[aria-selected="true"] .n,.crow[aria-selected="true"] .chev{color:var(--on-accent);opacity:.85;}
.crow[data-inpath="true"]:not([aria-selected="true"]){background:var(--sel-soft);}
.crow[data-running="true"]:not([aria-selected="true"]){background:var(--run-wash);}
.crow .stem{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px;}
.crow.unreached .stem{opacity:.55;font-style:italic;}
.crow .chev{color:var(--fg-faint);font-size:10px;flex:0 0 auto;}
.crow .n{font-family:var(--mono);font-size:10px;color:var(--fg-dim);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.crow .badge{font-family:var(--mono);font-size:9px;color:var(--fail);border:1px solid currentColor;
  border-radius:7px;padding:0 4px;flex:0 0 auto;}
.crow[aria-selected="true"] .badge{color:var(--on-accent);}
.crow .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:0 4px;border-radius:3px;border:1px solid currentColor;color:var(--replay);flex:0 0 auto;}
.crow[aria-selected="true"] .tag{color:var(--on-accent);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg-faint);flex:0 0 auto;}
.dot.pass{background:var(--pass);} .dot.fail{background:var(--fail);}
.dot.unreached{background:transparent;border:1px dashed var(--unreached);}
.dot.running{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
.crow[aria-selected="true"] .dot.running{background:var(--on-accent);}
@keyframes pulse{50%{opacity:.25;}}
@media (prefers-reduced-motion:reduce){.dot.running{animation:none;}}

/* ── preview ──────────────────────────────────────────────── */
.preview h3{margin:0 0 2px;font-family:var(--mono);font-size:13px;}
.preview .sub{font-family:var(--mono);font-size:11px;color:var(--fg-dim);margin-bottom:10px;}
.preview .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 10px;}
.preview dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);}
.preview dd{margin:0;font-family:var(--mono);font-size:11px;}
.preview dd.replay{color:var(--replay);}
.turn{padding:2px 0;}
.turn .c{font-family:var(--mono);font-size:11.5px;}
.turn .c b{color:var(--fg-faint);font-weight:400;}
.turn .a{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);padding-left:12px;}
.turn .a i{font-style:normal;color:var(--pass);}
.turn.bad{background:var(--fail-wash);}
.turn.bad .a i{color:var(--fail);}
.more{font-size:11px;color:var(--fg-faint);padding-top:6px;}

/* ── path bar + transport ─────────────────────────────────── */
.pathbar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--project);
  border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--fg-dim);}
.pathbar b{color:var(--fg);font-weight:600;}
.pathbar .sep{color:var(--fg-faint);}
.transport{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--rail);
  border-top:1px solid var(--border);font-size:11.5px;color:var(--fg-dim);flex-wrap:wrap;}
button.btn{font:inherit;font-size:11.5px;color:var(--fg);background:var(--editor);
  border:1px solid var(--border);border-radius:var(--radius);padding:3px 11px;cursor:pointer;}
button.btn:hover{border-color:var(--accent);color:var(--accent);}
button.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
button.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
select{font:inherit;font-size:11.5px;color:var(--fg);background:var(--editor);
  border:1px solid var(--border);border-radius:var(--radius);padding:2px 6px;}
.transport .src{margin-left:auto;font-size:10.5px;color:var(--fg-faint);}
.transport .src code{font-family:var(--mono);}
</style>

  $('sPass').textContent = '0'; $('sFail').textContent = '0'; $('sUnr').textContent = '0';
  $('sCmd').textContent = '0'; $('sCmdSub').textContent = '';
  $('sProg').textContent = '0 / 552'; $('sBar').style.width = '0';
  render();
}

function node(file, parent) {
  let n = nodes.get(file);
  if (!n) {
    n = { file, stem: stemOf(file), parent: parent ?? null, kids: [], status: 'pending',
          replays: 0, asserts: 0, turns: [], blockedBy: null, replayedFrom: null };
    nodes.set(file, n);
    if (parent) { const p = nodes.get(parent); if (p && !p.kids.includes(n)) p.kids.push(n); }
    else roots.push(n);
  }
  return n;
}

const ancestry = n => { const o = []; let c = n; while (c) { o.unshift(c); c = c.parent ? nodes.get(c.parent) : null; } return o; };
/** Only the selected path is on screen, so a failure off it must surface on the parent row. */
const subtreeFails = n => n.kids.reduce((k, c) => k + (c.status === 'failed' ? 1 : 0) + subtreeFails(c), 0);

function crow(n) {
  const r = el('button', 'crow ' + n.status);
  r.type = 'button'; r.dataset.file = n.file;
  r.setAttribute('aria-selected', String(n === selected));
  if (n !== selected && ancestry(selected || n).includes(n)) r.dataset.inpath = 'true';
  if (n === running) r.dataset.running = 'true';
  r.append(el('span', 'dot ' + (n === running ? 'running' : n.status)));
  r.append(el('span', 'stem', n.stem));
  const fails = subtreeFails(n);
  if (fails) r.append(el('span', 'badge', String(fails)));
  if (n.replays) r.append(el('span', 'tag', 'replay'));
  if (n.asserts) r.append(el('span', 'n', String(n.asserts)));
  if (n.kids.length) r.append(el('span', 'chev', '›'));
  return r;
}

function preview(n) {
  const pane = el('div', 'col preview');
  if (!n) { pane.append(el('div', 'more', 'Waiting for the first node…')); return pane; }
  pane.append(el('h3', null, n.stem));
  pane.append(el('div', 'sub', n.file.replace(/^.*\/branch-stories\//, 'branch-stories/')));
  const dl = el('dl', 'kv');
  dl.append(el('dt', null, 'Result'), el('dd', null,
    n.status === 'unreached' ? 'never ran — blocked by ' + stemOf(n.blockedBy)
    : n.status === 'pending' ? 'queued'
    : n.status === 'running' ? n.asserts + ' assertions so far…'
    : n.asserts + ' assertions ' + n.status));
  dl.append(el('dt', null, 'Ancestry'), el('dd', null, ancestry(n).map(a => a.stem).join(' › ')));
  if (n.replays) dl.append(el('dt', null, 'Replayed'),
    el('dd', 'replay', n.replays + '× to rebuild a sibling’s state'));
  pane.append(dl);
  if (n.status === 'unreached') {
    pane.append(el('div', 'more', 'No turns — an ancestor failed, so this branch never executed.'));
    return pane;
  }
  n.turns.slice(-40).forEach(t => {
    const box = el('div', 'turn' + (t.passed ? '' : ' bad'));
    const c = el('div', 'c'); c.append(el('b', null, '> '), document.createTextNode(t.input));
    box.append(c);
    const a = el('div', 'a');
    a.append(el('i', null, t.passed ? '✓' : '✗'), document.createTextNode(' ' + (t.error || 'assertion passed')));
    box.append(a);
    pane.append(box);
  });
  if (n.turns.length > 40) pane.append(el('div', 'more', '+ ' + (n.turns.length - 40) + ' earlier turns'));
  return pane;
}

/** One column per level of the selected path — exactly as Finder does. */
function render() {
  const wrap = $('cols');
  wrap.replaceChildren();
  const path = selected ? ancestry(selected) : [];
  let level = roots, depth = 0;
  while (level && level.length) {
    const col = el('div', 'col');
    level.forEach(n => col.append(crow(n)));
    wrap.append(col);
    const step = path[depth];
    if (!step || !step.kids.length) break;
    level = step.kids; depth += 1;
  }
  wrap.append(preview(selected));
  wrap.scrollLeft = wrap.scrollWidth;

  const bar = $('pathbar');
  bar.replaceChildren();
  path.forEach((n, i) => {
    if (i) bar.append(el('span', 'sep', '›'));
    bar.append(i === path.length - 1 ? el('b', null, n.stem) : el('span', null, n.stem));
  });

  wrap.querySelectorAll('[data-file]').forEach(btn => {
    btn.addEventListener('click', () => {
      selected = nodes.get(btn.dataset.file);
      follow = false; $('follow').setAttribute('aria-pressed', 'false');
      render();
    });
  });
}

function tallies() {
  const v = [...nodes.values()];
  const f = v.filter(n => n.status === 'failed').length;
  const u = v.filter(n => n.status === 'unreached').length;
  $('sPass').textContent = v.filter(n => n.status === 'passed').length;
  $('sFail').textContent = f; $('sFail').className = 'v' + (f ? ' fail' : '');
  $('sUnr').textContent = u; $('sUnr').className = 'v' + (u ? ' unr' : '');
  const done = authored + replayed;
  $('sCmd').firstChild.nodeValue = String(done);
  $('sCmdSub').textContent = ' ' + authored + ' authored · ' + replayed + ' replayed';
  $('sProg').textContent = done + ' / 552';
  $('sBar').style.width = (done / 552 * 100) + '%';
}

let openExec = null;

function apply(e) {
  if (e.type === 'run-start') { $('meta').textContent = e.mode + ' · seed 42'; return; }

  if (e.type === 'phase') {
    const id = 'ph-' + e.name;
    let c = document.getElementById(id);
    if (!c) { c = el('span'); c.id = id; $('phases').append(c); }
    c.className = 'chip' + (e.status === 'started' ? ' busy' : '');
    c.replaceChildren(document.createTextNode(e.name),
      el('span', 'ms', e.status === 'started' ? '…' : e.elapsedMs + ' ms'));
    return;
  }

  if (e.type === 'transcript-start') {
    const n = node(e.file, e.parent);
    openExec = { node: n, replayed: !!e.replayed };
    if (e.replayed) n.replays++;
    else { n.status = 'running'; running = n; n.turns = []; n.asserts = 0;
           if (follow) selected = n; }
    render();
    return;
  }

  if (e.type === 'command-result') {
    if (!openExec) return;
    if (openExec.replayed) replayed++;
    else {
      authored++;
      const n = openExec.node;
      n.asserts++;
      n.turns.push({ input: e.input, passed: e.passed, error: e.error });
    }
    tallies();
    if (!openExec.replayed && openExec.node === selected) {
      const cols = $('cols');
      cols.replaceChild(preview(selected), cols.lastChild);
      const p = cols.lastChild; p.scrollTop = p.scrollHeight;
    }
    return;
  }

  if (e.type === 'transcript-end') {
    const n = nodes.get(e.file) || node(e.file);
    if (e.status === 'unreached') { n.status = 'unreached'; n.blockedBy = e.blockedBy; }
    else if (!openExec || !openExec.replayed) {
      n.status = e.status;
      if (running === n) running = null;
    }
    openExec = null;
    tallies(); render();
    return;
  }

  if (e.type === 'run-end') { running = null; tallies(); render(); }
}

function playback() {
  reset();
  const scale = Number($('speed').value);
  EVENTS.forEach(e => timers.push(setTimeout(() => apply(e), e.elapsedMs * scale)));
}

$('play').addEventListener('click', playback);
$('speed').addEventListener('change', playback);
$('follow').addEventListener('click', () => {
  follow = !follow;
  $('follow').setAttribute('aria-pressed', String(follow));
  if (follow && running) { selected = running; render(); }
});
playback();
</script>
