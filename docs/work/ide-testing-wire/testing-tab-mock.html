<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharpee IDE — Testing tab</title>
<style>
:root{
  --rail:#DCE0E8; --project:#E6E9EF; --editor:#EFF1F5; --play:#E6E9EF; --border:#ACB0BE;
  --fg:#4C4F69; --fg-dim:#6C6F85; --fg-faint:#9CA0B0; --accent:#1E66F5; --on-accent:#EFF1F5;
  --pass:#40A02B; --fail:#D20F39; --unreached:#8C8FA1; --replay:#FE640B; --mauve:#8839EF;
  --sel-soft:#1E66F51a; --mauve-wash:#8839EF12;
  --ui:system-ui,-apple-system,"SF Pro Text",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --radius:5px; --row-h:26px; --colw:210px;
}
@media (prefers-color-scheme:dark){:root{
  --rail:#16171D; --project:#262832; --editor:#1E1F26; --play:#13141A; --border:#3A3C48;
  --fg:#D8D9E0; --fg-dim:#8E90A0; --fg-faint:#5C5F6D; --accent:#89B4FA; --on-accent:#11131A;
  --pass:#A6E3A1; --fail:#F38BA8; --unreached:#6C7086; --replay:#FAB387; --mauve:#CBA6F7;
  --sel-soft:#89B4FA22; --mauve-wash:#CBA6F714;
}}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--ui);font-size:13px;color:var(--fg);background:var(--editor);
  -webkit-font-smoothing:antialiased;line-height:1.5;}
.tab{display:flex;flex-direction:column;height:100%;}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;
  background:var(--rail);border-bottom:1px solid var(--border);flex:none;}
.toolbar .story{font-weight:600;}
.toolbar .meta{font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);font-variant-numeric:tabular-nums;}
.spacer{flex:1 1 auto;}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.seg button{font:inherit;font-size:11.5px;padding:3px 12px;border:0;cursor:pointer;
  background:transparent;color:var(--fg-dim);display:flex;align-items:center;gap:6px;}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600;}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.glyph{font-family:var(--mono);font-size:11px;letter-spacing:-1px;}

.body{flex:1;min-height:0;display:flex;}
.pane{flex:1;min-height:0;display:none;}
.pane.on{display:flex;}

/* ── columns ─────────────────────────────────────────────── */
.cols{flex:1;display:flex;align-items:stretch;min-height:0;overflow-x:auto;}
.col{flex:0 0 var(--colw);border-right:1px solid var(--border);overflow-y:auto;background:var(--editor);}
.col.preview{flex:1 1 330px;min-width:290px;border-right:0;background:var(--project);padding:12px 14px;overflow-y:auto;}
.crow{display:flex;align-items:center;gap:7px;width:100%;height:var(--row-h);padding:0 8px;
  border:0;background:transparent;font:inherit;color:inherit;cursor:default;text-align:left;}
.crow:hover{background:var(--sel-soft);}
.crow[aria-selected="true"]{background:var(--accent);color:var(--on-accent);}
.crow[data-inpath="true"]:not([aria-selected="true"]){background:var(--sel-soft);}
.crow[aria-selected="true"] .n,.crow[aria-selected="true"] .chev{color:var(--on-accent);opacity:.85;}
.crow .stem{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px;}
.crow .n{font-family:var(--mono);font-size:10px;color:var(--fg-dim);font-variant-numeric:tabular-nums;}
.crow .chev{color:var(--fg-faint);font-size:10px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pass);flex:0 0 auto;}

/* ── list ────────────────────────────────────────────────── */
.listwrap{flex:1;display:flex;min-height:0;}
.list{flex:1 1 auto;overflow-y:auto;padding:4px 0;min-width:0;}
.lrow{display:flex;align-items:center;gap:6px;height:var(--row-h);width:100%;border:0;
  background:transparent;font:inherit;color:inherit;cursor:default;text-align:left;padding-right:12px;}
.lrow:hover{background:var(--sel-soft);}
.lrow[aria-selected="true"]{background:var(--accent);color:var(--on-accent);}
.lrow[aria-selected="true"] .n{color:var(--on-accent);opacity:.85;}
.lrow .tw{color:var(--fg-faint);font-size:9px;width:10px;flex:0 0 auto;}
.lrow .stem{flex:1 1 auto;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;}
.lrow .n{font-family:var(--mono);font-size:10px;color:var(--fg-dim);font-variant-numeric:tabular-nums;}
.side{flex:0 0 330px;border-left:1px solid var(--border);background:var(--project);
  padding:12px 14px;overflow-y:auto;}

/* ── documents ───────────────────────────────────────────── */
.docwrap{flex:1;overflow-y:auto;}
.groupbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--project);
  border-bottom:1px solid var(--border);border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-faint);
  position:sticky;top:0;z-index:1;}
.groupbar:first-child{border-top:0;}
.groupbar.prop{color:var(--mauve);background:var(--mauve-wash);}
.groupbar .act{margin-left:auto;display:flex;gap:6px;}
.groupbar .act button{font:inherit;font-size:10.5px;text-transform:none;letter-spacing:0;
  color:var(--fg-dim);background:var(--editor);border:1px solid var(--border);
  border-radius:3px;padding:1px 8px;cursor:pointer;}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:14px;}
.doc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;
  border-radius:var(--radius);border:1px solid transparent;background:transparent;
  font:inherit;color:inherit;cursor:default;}
.doc:hover{background:var(--sel-soft);}
.doc[aria-selected="true"]{background:var(--sel-soft);border-color:var(--accent);}
.doc.proposed{border-style:dashed;border-color:var(--mauve);}
.sheet{width:60px;height:76px;border:1px solid var(--border);border-radius:3px;background:var(--editor);
  padding:7px 6px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px #00000014;flex:none;}
.sheet i{display:block;height:2px;border-radius:1px;background:var(--fg-faint);opacity:.45;}
.sheet i.cmd{background:var(--accent);opacity:.7;}
.sheet.pass{border-bottom:2px solid var(--pass);}
.sheet.prop{border-style:dashed;background:transparent;}
.doc .name{font-family:var(--mono);font-size:10.5px;text-align:center;line-height:1.35;word-break:break-word;}
.doc .sub{font-family:var(--mono);font-size:9px;color:var(--fg-faint);}
.pill{font-family:var(--mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;
  padding:0 4px;border-radius:3px;border:1px solid currentColor;color:var(--mauve);}

/* ── opened document ─────────────────────────────────────── */
.docview{flex:1;display:none;flex-direction:column;min-height:0;background:var(--editor);}
.docview.on{display:flex;}
.docview > header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;
  background:var(--project);border-bottom:1px solid var(--border);flex:none;}
.docview h2{margin:0;font-family:var(--mono);font-size:14px;font-weight:600;}
.docview .path{font-family:var(--mono);font-size:11px;color:var(--fg-dim);}
.back{font:inherit;font-size:11.5px;color:var(--fg);background:var(--editor);
  border:1px solid var(--border);border-radius:var(--radius);padding:3px 10px;cursor:pointer;}
.back:hover{border-color:var(--accent);color:var(--accent);}
.docmeta{display:flex;gap:0;background:var(--project);border-bottom:1px solid var(--border);flex:none;
  flex-wrap:wrap;}
.docmeta div{padding:7px 14px;display:flex;flex-direction:column;gap:1px;}
.docmeta div+div{border-left:1px solid var(--border);}
.docmeta .k{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);}
.docmeta .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;}
.docmeta .v.pass{color:var(--pass);}
.turns{flex:1;overflow-y:auto;padding:8px 0 20px;}
.turn{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;padding:3px 14px;align-items:baseline;}
.turn:hover{background:var(--sel-soft);}
.turn .ln{font-family:var(--mono);font-size:9.5px;color:var(--fg-faint);font-variant-numeric:tabular-nums;text-align:right;}
.turn .cmd{font-family:var(--mono);font-size:12px;}
.turn .cmd b{color:var(--fg-faint);font-weight:400;}
.turn .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--pass);}

.pathbar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--project);
  border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--fg-dim);
  overflow-x:auto;white-space:nowrap;flex:none;}
.pathbar b{color:var(--fg);font-weight:600;}
.pathbar .sep{color:var(--fg-faint);}
.pathbar .hint{margin-left:auto;color:var(--fg-faint);white-space:nowrap;}
.prev h3{margin:0 0 2px;font-family:var(--mono);font-size:13px;}
.prev .sub{font-family:var(--mono);font-size:11px;color:var(--fg-dim);margin-bottom:10px;}
.prev .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 12px;}
.prev dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);}
.prev dd{margin:0;font-family:var(--mono);font-size:11px;}
.prev .open{font:inherit;font-size:11.5px;color:var(--on-accent);background:var(--accent);
  border:1px solid var(--accent);border-radius:var(--radius);padding:3px 12px;cursor:pointer;}
.prev .t{font-family:var(--mono);font-size:11px;padding:1px 0;color:var(--fg-dim);}
.prev .t b{color:var(--fg-faint);font-weight:400;}
</style></head>

<script>
const NODES = JSON.parse(document.getElementById('data').textContent);
const BY = new Map(NODES.map(n => [n.stem, n]));
NODES.forEach(n => { n.kids = NODES.filter(k => k.parent === n.stem); });
const ROOTS = NODES.filter(n => !n.parent);

/* Illustrative only — ADR-131's explorer is unbuilt and has never emitted a
   finding. Included because the document grid is the surface on which a
   machine-proposed path can be accepted or discarded as a thing. */
const PROPOSED = [
  { stem: 'softlock-cellar-no-lamp', sub: 'found at 12 400 states', turns: [
      ['north',1,1],['north',2,1],['open the cellar door',3,1],['down',4,1],
      ['close the cellar door',5,1],['look',6,1]] },
  { stem: 'unwinnable-shears-lost', sub: 'found at depth 14', turns: [
      ['north',1,1],['east',2,1],['take the garden shears',3,1],['west',4,1],
      ['put the shears in the fountain',5,1],['east',6,1]] },
];

const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const $ = id => document.getElementById(id);
const ancestry = n => { const o = []; let c = n; while (c) { o.unshift(c); c = c.parent ? BY.get(c.parent) : null; } return o; };

let mode = 'col', selected = BY.get('smoke'), opened = null;

/* ── shared bits ───────────────────────────────────────────────── */
function sheet(turns, proposed) {
  const s = el('div', 'sheet ' + (proposed ? 'prop' : 'pass'));
  for (let i = 0; i < 6; i++) {
    const line = el('i', i % 2 === 0 ? 'cmd' : '');
    line.style.width = (i % 2 === 0 ? 62 : [88, 70, 80][(i / 2) | 0] ?? 74) + '%';
    s.append(line);
  }
  return s;
}

function turnRows(node, host) {
  node.turns.forEach(([input, line, ok]) => {
    const t = el('div', 'turn');
    t.append(el('div', 'ln', String(line)));
    const c = el('div', 'cmd'); c.append(el('b', null, '> '), document.createTextNode(input));
    t.append(c);
    t.append(el('div', 'r', ok ? 'PASS' : 'FAIL'));
    host.append(t);
  });
}

/* ── opened document — the reading surface ─────────────────────── */
function openDoc(node) { opened = node; render(); }

function renderDocView() {
  const v = $('docview');
  v.replaceChildren();
  if (!opened) return;
  const head = document.createElement('header');
  const back = el('button', 'back', '‹ Back');
  back.type = 'button';
  back.addEventListener('click', () => { opened = null; render(); });
  head.append(back, el('h2', null, opened.stem));
  head.append(el('span', 'path', opened.file ?? ('tests/transcripts/' + opened.stem + '.transcript')));
  v.append(head);

  const meta = el('div', 'docmeta');
  const add = (k, val, cls) => { const d = el('div'); d.append(el('span', 'k', k), el('span', 'v' + (cls ? ' ' + cls : ''), val)); meta.append(d); };
  if (opened.proposed) {
    add('Origin', 'explorer'); add('Turns', String(opened.turns.length));
    add('Status', 'proposed'); add('Action', 'accept or discard');
  } else {
    add('Result', opened.turns.length + ' passed', 'pass');
    add('Ancestry', ancestry(opened).map(a => a.stem).join(' › '));
    add('Duration', (opened.ms ?? 0) + ' ms');
    add('Children', opened.kids.length ? String(opened.kids.length) : 'leaf');
  }
  v.append(meta);

  const turns = el('div', 'turns');
  turnRows(opened, turns);
  v.append(turns);
}

/* ── column mode ───────────────────────────────────────────────── */
function crow(n) {
  const r = el('button', 'crow'); r.type = 'button';
  r.setAttribute('aria-selected', String(n === selected));
  if (n !== selected && ancestry(selected).includes(n)) r.dataset.inpath = 'true';
  r.append(el('span', 'dot'), el('span', 'stem', n.stem), el('span', 'n', String(n.turns.length)));
  if (n.kids.length) r.append(el('span', 'chev', '›'));
  r.addEventListener('click', () => { selected = n; render(); });
  r.addEventListener('dblclick', () => openDoc(n));
  return r;
}

function preview(n, host) {
  host.append(el('h3', null, n.stem));
  host.append(el('div', 'sub', n.file));
  const dl = el('dl', 'kv');
  dl.append(el('dt', null, 'Result'), el('dd', null, n.turns.length + ' assertions passed'));
  dl.append(el('dt', null, 'Ancestry'), el('dd', null, ancestry(n).map(a => a.stem).join(' › ')));
  dl.append(el('dt', null, 'Children'), el('dd', null, n.kids.length ? String(n.kids.length) : 'none — a leaf'));
  host.append(dl);
  const open = el('button', 'open', 'Open document');
  open.type = 'button';
  open.addEventListener('click', () => openDoc(n));
  host.append(open);
  const list = el('div');
  list.style.marginTop = '12px';
  n.turns.slice(0, 8).forEach(([input]) => {
    const t = el('div', 't'); t.append(el('b', null, '> '), document.createTextNode(input)); list.append(t);
  });
  if (n.turns.length > 8) list.append(el('div', 't', '… ' + (n.turns.length - 8) + ' more — open to read'));
  host.append(list);
}

function renderCols() {
  const wrap = $('cols'); wrap.replaceChildren();
  const path = ancestry(selected);
  let level = ROOTS, depth = 0;
  while (level.length) {
    const col = el('div', 'col');
    level.forEach(n => col.append(crow(n)));
    wrap.append(col);
    const step = path[depth];
    if (!step || !step.kids.length) break;
    level = step.kids; depth += 1;
  }
  const p = el('div', 'col preview prev');
  preview(selected, p);
  wrap.append(p);
  wrap.scrollLeft = wrap.scrollWidth;
}

/* ── list mode ─────────────────────────────────────────────────── */
function renderList() {
  const host = $('list'); host.replaceChildren();
  const walk = (n, d) => {
    const r = el('button', 'lrow'); r.type = 'button';
    r.style.paddingLeft = (10 + d * 16) + 'px';
    r.setAttribute('aria-selected', String(n === selected));
    r.append(el('span', 'tw', n.kids.length ? '▾' : ''));
    r.append(el('span', 'stem', n.stem), el('span', 'n', String(n.turns.length)));
    r.addEventListener('click', () => { selected = n; render(); });
    r.addEventListener('dblclick', () => openDoc(n));
    host.append(r);
    n.kids.forEach(k => walk(k, d + 1));
  };
  ROOTS.forEach(r => walk(r, 0));
  const side = $('listside'); side.replaceChildren();
  preview(selected, side);
}

/* ── document mode ─────────────────────────────────────────────── */
function docTile(n, proposed) {
  const b = el('button', 'doc' + (proposed ? ' proposed' : '')); b.type = 'button';
  b.setAttribute('aria-selected', String(!proposed && n === selected));
  b.append(sheet(n.turns, proposed));
  b.append(el('span', 'name', n.stem));
  b.append(el('span', 'sub', proposed ? n.sub : n.turns.length + ' passed'));
  if (proposed) b.append(el('span', 'pill', 'proposed'));
  b.addEventListener('click', () => { if (!proposed) selected = n; render(); });
  b.addEventListener('dblclick', () => openDoc(n));
  return b;
}

function renderDocs() {
  const host = $('docs'); host.replaceChildren();
  const group = (label, items, proposed) => {
    const bar = el('div', 'groupbar' + (proposed ? ' prop' : ''), label);
    if (proposed) {
      const act = el('div', 'act');
      ['Accept', 'Discard'].forEach(t => { const b = el('button', null, t); b.type = 'button'; act.append(b); });
      bar.append(act);
    }
    host.append(bar);
    const grid = el('div', 'docs');
    items.forEach(n => grid.append(docTile(n, proposed)));
    host.append(grid);
  };
  group('roots', ROOTS, false);
  ROOTS.concat(NODES).filter(n => n.kids.length).forEach(n => group('children of ' + n.stem, n.kids, false));
  group('proposed by the explorer — ' + PROPOSED.length, PROPOSED, true);
}

/* ── frame ─────────────────────────────────────────────────────── */
function render() {
  $('meta').textContent = NODES.length + ' nodes · depth 3 · 518 authored turns';
  const showDoc = opened !== null;
  $('docview').classList.toggle('on', showDoc);
  ['col', 'list', 'doc'].forEach(m => {
    $('pane-' + m).classList.toggle('on', !showDoc && mode === m);
  });
  if (!showDoc) {
    if (mode === 'col') renderCols();
    else if (mode === 'list') renderList();
    else renderDocs();
  } else renderDocView();

  const bar = $('pathbar'); bar.replaceChildren();
  const target = opened && !opened.proposed ? opened : opened ? null : selected;
  if (target) ancestry(target).forEach((n, i, a) => {
    if (i) bar.append(el('span', 'sep', '›'));
    bar.append(i === a.length - 1 ? el('b', null, n.stem) : el('span', null, n.stem));
  });
  else if (opened) bar.append(el('b', null, opened.stem));
  bar.append(el('span', 'hint', showDoc ? 'Back returns to the ' + mode + ' view'
    : 'Click selects · double-click opens the document'));
}

document.querySelectorAll('.seg button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    mode = b.dataset.mode; opened = null; render();
  });
});
render();
</script>
</body></html>
