<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock — State picker (ADR-306 D6: one list, Grouped toggle)</title>
<style>
  /* Palette = tools/ide/SharpeeIDE/Theme.swift, verbatim. Light : Dark. */
  :root {
    --play-bg:    #E6E9EF;
    --block-bg:   #EFF1F5;
    --rail-bg:    #DCE0E8;
    --border:     #ACB0BE;
    --fg:         #4C4F69;
    --fg-dim:     #6C6F85;
    --fg-faint:   #9CA0B0;
    --accent:     #1E66F5;
    --assert:     #40A02B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --play-bg:  #13141A;
      --block-bg: #1E1F26;
      --rail-bg:  #16171D;
      --border:   #3A3C48;
      --fg:       #D8D9E0;
      --fg-dim:   #8E90A0;
      --fg-faint: #5C5F6D;
      --accent:   #89B4FA;
      --assert:   #A6E3A1;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--play-bg);
    color: var(--fg);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 18px;
  }
  header h1 { font-size: 13px; font-weight: 600; }
  header .note { color: var(--fg-dim); font-size: 12px; }
  .scale {
    margin-left: auto;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .scale button {
    font: inherit; color: var(--fg-dim);
    background: var(--block-bg);
    border: none; padding: 4px 12px; cursor: pointer;
  }
  .scale button.on { background: var(--accent); color: var(--play-bg); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 18px;
    min-height: 0;
  }

  /* The picker popover as it would appear anchored to a card's State… button */
  .picker {
    flex: 1;
    min-height: 0;
    width: 46ch;
    display: flex;
    flex-direction: column;
    background: var(--block-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .picker .filter {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .picker .filter input {
    flex: 1;
    font: inherit;
    color: var(--fg);
    background: var(--play-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
    outline: none;
  }
  .picker .filter input:focus { border-color: var(--accent); }
  .picker .filter .grouped {
    font: inherit;
    color: var(--fg-dim);
    background: var(--play-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .picker .filter .grouped.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--play-bg);
  }
  .picker .list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .fact {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .fact:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .fact .k { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
  .fact .v { color: var(--fg-dim); margin-left: auto; }
  .fact .kind {
    color: var(--fg-faint);
    font-size: 11px;
    flex: 0 0 4.5em;
  }
  .ghead {
    position: sticky;
    top: 0;
    padding: 5px 12px 3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-faint);
    text-transform: uppercase;
    letter-spacing: .06em;
    background: var(--block-bg);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
    cursor: pointer;
    user-select: none;
  }
  .ghead:hover { color: var(--fg-dim); }
  .ghead .n { font-weight: 400; }
  .ghead .chev {
    display: inline-block;
    width: 1.1em;
    transition: transform .12s;
  }
  .ghead.folded .chev { transform: rotate(-90deg); }
  .empty { padding: 14px 12px; color: var(--fg-faint); }

  /* What clicking writes — the source panel's new line */
  .writes {
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    min-height: 38px;
    width: 46ch;
  }
  .writes .lbl { color: var(--fg-faint); font-size: 11px; }
  .writes code { color: var(--assert); }
</style>
</head>
<body>

<header>
  <h1>State picker (ADR-306 D6 — one list, Grouped toggle)</h1>
  <span class="note">opened by a card's <b>State…</b> button; lists only what the prose does not show; never free text</span>
  <div class="scale">
    <button id="sc-small" class="on">Fernhill scale (5)</button>
    <button id="sc-large">large Chord story (~90, synthetic)</button>
  </div>
</header>

<main>
  <div class="picker">
    <div class="filter">
      <input id="f" placeholder="filter facts…">
      <button id="grp" class="grouped" title="Fold the list into kind sections — same list, presentation only">Grouped</button>
    </div>
    <div class="list" id="l"></div>
  </div>
  <div class="writes"><span class="lbl">clicking writes →</span><br><code id="w">&nbsp;</code></div>
</main>

<script>
  // ── data ────────────────────────────────────────────────────────────
  // Small = Fernhill's shape (illustrative). Large = SYNTHETIC placeholder
  // facts at the scale a bigger Chord story would carry — generated filler,
  // not story content. Kinds mirror the world digest: npc / item / score /
  // machine (the unseen slice; never player.location).
  const SMALL = [
    { kind: 'npc',     key: 'auctioneer.location',        val: 'gravel-drive' },
    { kind: 'item',    key: 'tarnished-key.location',     val: 'cellar' },
    { kind: 'item',    key: 'auction-notice.location',    val: 'iron-gates' },
    { kind: 'score',   key: 'score',                      val: '3' },
    { kind: 'machine', key: 'timeline.state',             val: 'before-dawn' },
  ];

  const LARGE = (() => {
    const npcs = ['auctioneer','gardener','housekeeper','solicitor','stable-hand',
      'cook','vicar','poacher','locksmith','coachman','maid','surveyor'];
    const rooms = ['gravel-drive','iron-gates','fountain-court','boiler-shed',
      'cellar','kitchen','scullery','library','long-gallery','orangery',
      'stable-yard','walled-garden'];
    const items = ['tarnished-key','auction-notice','ledger','candle-stub',
      'coil-of-rope','brass-lamp','sealed-letter','pocket-watch','garden-shears',
      'coal-scuttle','silver-spoon','hymn-book','field-map','ink-bottle',
      'riding-crop','horseshoe','lantern','signet-ring','deed-box','skeleton-key',
      'wine-bottle','music-box','portrait-miniature','iron-poker'];
    const machines = [
      ['timeline',       'before-dawn'],
      ['auction',        'not-started'],
      ['boiler',         'cold'],
      ['weather',        'drizzle'],
      ['household',      'asleep'],
      ['gate-watch',     'unmanned'],
    ];
    const facts = [];
    npcs.forEach((n, i) => facts.push({ kind: 'npc', key: n + '.location', val: rooms[i % rooms.length] }));
    items.forEach((it, i) => facts.push({ kind: 'item', key: it + '.location', val: rooms[(i * 5 + 3) % rooms.length] }));
    items.slice(0, 18).forEach((it, i) => facts.push({ kind: 'item', key: it + '.moved', val: i % 3 ? 'false' : 'true' }));
    facts.push({ kind: 'score', key: 'score', val: '11' });
    machines.forEach(([m, s]) => facts.push({ kind: 'machine', key: m + '.state', val: s }));
    machines.forEach(([m]) => facts.push({ kind: 'machine', key: m + '.turns-in-state', val: String(2 + m.length % 7) }));
    return facts;
  })();
  ['front-door.locked','cellar-door.locked','deed-box.locked','gate.open',
   'lamp.lit','boiler-valve.open','trapdoor.discovered','letter.read',
   'ledger.read','bell-rope.cut','window.broken','path.cleared',
   'dogs.fed','horse.saddled','fire.laid','pantry.raided',
   'chapel.visited','attic.unlocked','well.drained','safe.cracked',
   'map.studied','watch.wound','ring.appraised'].forEach((k, i) =>
    LARGE.push({ kind: 'item', key: k, val: i % 2 ? 'true' : 'false' }));

  const KINDS = [
    ['npc',     'NPC locations'],
    ['item',    'Items'],
    ['score',   'Score'],
    ['machine', 'State machines'],
  ];

  // ── rendering ───────────────────────────────────────────────────────
  let facts = SMALL;
  let grouped = false;
  const folded = new Set();   // collapsed kinds; typing a filter overrides (auto-expand)

  const el = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const line = (f) => `[STATE: true, ${f.key} is ${f.val}]`;

  function row(f, showKind) {
    const d = document.createElement('div');
    d.className = 'fact';
    d.innerHTML = (showKind ? `<span class="kind">${f.kind}</span>` : '') +
      `<span class="k">${esc(f.key)}</span><span class="v">${esc(f.val)}</span>`;
    d.addEventListener('click', () => el('w').textContent = line(f));
    return d;
  }

  function render() {
    const q = el('f').value.trim().toLowerCase();
    const list = el('l');
    list.innerHTML = '';
    const match = f => (f.key + ' ' + f.val + ' ' + f.kind).includes(q);

    if (!grouped) {
      const hits = facts.filter(match);
      if (!hits.length) { list.innerHTML = '<div class="empty">no matching facts</div>'; return; }
      hits.forEach(f => list.appendChild(row(f, true)));
      return;
    }

    let any = false;
    for (const [kind, label] of KINDS) {
      const hits = facts.filter(f => f.kind === kind && match(f));
      if (!hits.length) continue;
      any = true;
      const isFolded = !q && folded.has(kind);   // a live filter auto-expands
      const h = document.createElement('div');
      h.className = 'ghead' + (isFolded ? ' folded' : '');
      h.innerHTML = `<span class="chev">▾</span>${label} <span class="n">· ${hits.length}</span>`;
      h.addEventListener('click', () => {
        folded.has(kind) ? folded.delete(kind) : folded.add(kind);
        render();
      });
      list.appendChild(h);
      if (!isFolded) hits.forEach(f => list.appendChild(row(f, false)));
    }
    if (!any) list.innerHTML = '<div class="empty">no matching facts</div>';
  }

  el('f').addEventListener('input', render);
  el('grp').addEventListener('click', () => {
    grouped = !grouped;
    el('grp').classList.toggle('on', grouped);
    render();
  });
  el('sc-small').addEventListener('click', () => {
    facts = SMALL;
    el('sc-small').classList.add('on'); el('sc-large').classList.remove('on');
    render();
  });
  el('sc-large').addEventListener('click', () => {
    facts = LARGE;
    el('sc-large').classList.add('on'); el('sc-small').classList.remove('on');
    render();
  });

  render();
</script>
</body>
</html>
