# SonarCloud AUTOMATIC analysis reads this file and ignores sonar-project.properties
# (which CI-based analysis would read). The two are kept in step by hand.
# A value here wins over the same setting in the SonarCloud UI.

# Build artifacts, generated modules (held fresh by `./repokit grammar|manifest --check`)
# and the IDE's built testing-surface bundle (built from tools/ide/web/testing-surface).
sonar.exclusions=website/public/**,templates/**,**/dist/**,**/dist-esm/**,**/dist-npm/**,packages/chord/src/stdlib-manifest.ts,packages/parser-en-us/src/grammar.ts,tools/ide/SharpeeIDE/Resources/testing-surface/**

# Test files, classified as tests: a test file is never scanned for duplication.
sonar.test.inclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.config.ts,**/vitest.config.js

# Copy-paste detection exclusions, as a second line of defence for the same files.
sonar.cpd.exclusions=**/tests/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.config.ts,**/vitest.config.js,website/public/**,templates/**,packages/runtime/src/index.ts,packages/bridge/src/index.ts
