# Sharpee IDE — XcodeGen project spec
# Source of truth for SharpeeIDE.xcodeproj.
# Regenerate the .xcodeproj with: `xcodegen generate` (run from this directory).

name: SharpeeIDE

options:
  bundleIdPrefix: net.sharpee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "11.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # Disable Xcode's Previews stub-executor for debug builds.
    # The stub launches a separate dylib and breaks plain `open`/terminal launches on macOS 26.
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_PREVIEWS: NO

# No Swift Package dependencies: highlighting is the in-process ChordLexer
# (ADR-258 D7) — tree-sitter left with the TypeScript author path (D3).

targets:
  SharpeeIDE:
    type: application
    platform: macOS
    sources:
      - path: SharpeeIDE
        # The Testing tab's bundle is added below as a FOLDER reference; without
        # this exclude XcodeGen would also add each file individually and the
        # copy phase would carry them twice.
        excludes:
          - "Resources/docs-tab/**"
          - "Resources/play-themes/**"
          - "Resources/testing-surface/**"
      # The Documentation tab's bundle (go-live Phase 3): sharpee.net's author
      # documentation, reduced from MDX and rendered to HTML fragments. A folder
      # reference for the same reasons as the Testing tab above — copied whole,
      # and adding a page never needs a project regenerate. Committed for the
      # same reason too: XcodeGen resolves this path at generate time, so a
      # gitignored folder would make `xcodegen generate` on a fresh clone
      # silently produce an app with no Documentation tab.
      - path: SharpeeIDE/Resources/docs-tab
        type: folder
        buildPhase: resources
      # The platform-browser built-in theme set, mirrored by
      # vendor-play-themes.sh (go-live Phase 6b): the Play pane offers every
      # built-in theme as IDE chrome regardless of what the open story ships.
      # A committed folder reference for the same reasons as the two above.
      - path: SharpeeIDE/Resources/play-themes
        type: folder
        buildPhase: resources
      # The testing play surface's web bundle (ADR-306 Phase 3): the card /
      # segment UI injected into the story's testing page. A committed folder
      # reference for the same reasons as the tabs above.
      - path: SharpeeIDE/Resources/testing-surface
        type: folder
        buildPhase: resources
    dependencies:
      - sdk: WebKit.framework
    # The tab bundles are esbuild output the app copies in — cheap (one
    # esbuild pass each), so unlike the toolchain vendoring below they are NOT
    # opt-in: a stale bundle is a wrong bundle. Degrade to warnings without node.
    preBuildScripts:
      # The docs bundler is one corpus walk plus one
      # esbuild pass (~150ms for 143 pages), so stale documentation is not worth
      # saving it. Deliberately NOT the website's Next build — see the script.
      - name: Bundle the Documentation tab (go-live Phase 3)
        basedOnDependencyAnalysis: false
        script: '"$PROJECT_DIR/build-docs-tab.sh"'
      # One directory copy — too cheap to be opt-in, and a stale theme mirror
      # would quietly diverge from what `sharpee build` ships (Phase 6b).
      - name: Vendor play themes (go-live Phase 6b)
        basedOnDependencyAnalysis: false
        script: '"$PROJECT_DIR/vendor-play-themes.sh"'
      # Same trade as the Testing tab: one esbuild pass, and a stale surface
      # is a wrong surface (ADR-306 Phase 3).
      - name: Bundle the testing play surface (ADR-306 Phase 3)
        basedOnDependencyAnalysis: false
        script: '"$PROJECT_DIR/build-testing-surface.sh"'
    # ADR-279 D4 — assemble the bundled toolchain into Contents/Resources.
    # OPT-IN, not automatic: assembling costs a `pnpm deploy` (~1-2 min on a
    # cold run) and ~176MB, which would violate Acceptance 5's "dev-loop builds
    # are unaffected" if it ran on every xcodebuild. Release packaging
    # (package.sh, Phase 3) sets the flag; a developer wanting to exercise the
    # bundled tier locally runs:
    #   SHARPEE_VENDOR_TOOLCHAIN=1 xcodebuild -scheme SharpeeIDE
    # Without it the app simply has no third tier — BundledToolchain resolves
    # nil and the shim/PATH tiers carry the dev loop exactly as before.
    postBuildScripts:
      - name: Vendor Sharpee toolchain (ADR-279 D4)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${SHARPEE_VENDOR_TOOLCHAIN:-0}" = "1" ]; then
            # SHARPEE_TOOLCHAIN_ARCH is set by package.sh alongside ARCHS so the
            # bundled toolchain matches the slice being built. Unset (a plain
            # xcodebuild) means vendor-toolchain.sh defaults to the build host,
            # which is what the dev loop wants.
            "$PROJECT_DIR/vendor-toolchain.sh" \
              "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
              ${SHARPEE_TOOLCHAIN_ARCH:+--arch "$SHARPEE_TOOLCHAIN_ARCH"}
          else
            echo "note: skipping bundled toolchain (set SHARPEE_VENDOR_TOOLCHAIN=1 to assemble it)"
          fi
    info:
      path: SharpeeIDE/Info.plist
      properties:
        # ADR-279 D1: the product is "Chord Writer", on its own version line
        # starting 1.0.0 (platform/Chord versions are displayed alongside, not
        # encoded here). The Xcode target and Swift module stay `SharpeeIDE` —
        # an internal identifier, never user-visible.
        CFBundleName: Chord Writer
        CFBundleDisplayName: Chord Writer
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 David Cornelson"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sharpee.chord-writer
        # The bundle ships as "Chord Writer.app" (ADR-279 D1/D2, Acceptance 1);
        # PRODUCT_MODULE_NAME pins the Swift module so `@testable import
        # SharpeeIDE` keeps working across SharpeeIDETests.
        PRODUCT_NAME: Chord Writer
        PRODUCT_MODULE_NAME: SharpeeIDE
        # SINGLE-SLICE, AND DELIBERATELY SO — but no longer arm64-only.
        # Chord Writer ships as SEPARATE PER-ARCH INSTALLERS (David 2026-08-13),
        # not a universal binary. Each app carries a bundled Node runtime and
        # devkit closure for exactly one architecture (ADR-279 D4), so a
        # universal slice would ship a Build button with the wrong toolchain
        # behind it for half the machines it runs on. Two thin apps, two DMGs.
        #
        # This default is the DEV-LOOP value, matching the machine the project
        # is developed on. Release packaging overrides it per arch:
        #   xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO ...
        # and package.sh passes the same arch on to vendor-toolchain.sh so the
        # bundled toolchain and the app slice always agree. They must: a mismatch
        # is not a build error, it is an app that launches and then cannot build.
        #
        # NOT a notarization constraint. An earlier note here claimed universal
        # builds could not be notarized, from one matched pair on 2026-08-12.
        # That was falsified 2026-08-13 — a universal build was Accepted in ~103
        # seconds (submission 975d1c21-68bd-400a-a591-14818bb4b425) — once the
        # notary's intermittency was understood. Arch and notarization are
        # unrelated; do not reintroduce that reasoning.
        #
        # DEPLOYMENT TARGET 11.0 FOR BOTH ARCHES (David 2026-08-13). Verified on
        # the real tarballs: both the arm64 and x64 Node runtimes are minos 11.0,
        # so the toolchain reaches as far as the app does on either. Three
        # `isInspectable` calls are availability-guarded and one
        # `loadViewIfNeeded()` was replaced with the portable `_ = view` to hold
        # that floor; raising it again should be a decision, not a side effect of
        # reaching for a newer API.
        ARCHS: arm64
        # Dev builds sign with the Apple Development cert (not ad-hoc "-"):
        # TCC ties folder-access grants to the signing identity, and an ad-hoc
        # signature changes every rebuild, so macOS re-prompts for Documents/
        # Desktop access on each ⌘R. Release packaging (package.sh) still
        # re-signs with Developer ID.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RSNGKW5LNH
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SharpeeIDETests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SharpeeIDETests
    dependencies:
      - target: SharpeeIDE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sharpee.chord-writer.tests
        PRODUCT_NAME: SharpeeIDETests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chord Writer.app/Contents/MacOS/Chord Writer"
        # MANUAL signing with the same team identity (signing-rot systemic
        # fix, 2026-08-10 — 5 sessions/8 incidents of the nested xctest
        # losing its signature to the Automatic provisioning race). Manual
        # bypasses Xcode's background provisioning updater — the race's
        # home — while keeping the TEAM ID the hardened-runtime host's
        # library validation requires (ad-hoc "-" was tried and refused to
        # load: "different Team IDs").
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: RSNGKW5LNH
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SharpeeIDE:
    build:
      targets:
        SharpeeIDE: all
        SharpeeIDETests: [test]
    test:
      targets:
        - SharpeeIDETests
      gatherCoverageData: false
